[package]
name = "vello_winit_example"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Open the examples in the zgui editor instead of the winit preview.
zgui = ["dep:zgui_editor"]

[dependencies]
zgui_editor = { workspace = true, optional = true, features = ["audio"] }
motiongfx_2d = { workspace = true }
vello_motiongfx = { workspace = true }
vello_winit_motiongfx = { workspace = true, features = ["audio"] }
motiongfx_audio = { workspace = true, features = ["fundsp"] }
motiongfx = { workspace = true, default-features = true }
peniko_motiongfx = { workspace = true }
vello = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }

[lints]
workspace = true
