[package]
name = "vello_winit_motiongfx"
description = "Reusable Winit window and playback host for Vello MotionGfx animations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Play the scene's sound events (`Window::audio`) through the default
# output device.
audio = ["dep:motiongfx_audio"]

[dependencies]
motiongfx_audio = { workspace = true, optional = true, features = ["cpal"] }
motiongfx_2d = { workspace = true }
vello_motiongfx = { workspace = true }
vello = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }

[lints]
workspace = true
