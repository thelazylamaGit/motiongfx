[package]
name = "motiongfx_audio"
description = "Sound events for MotionGfx animations: synths, SoundFonts and samples, played live or rendered offline."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["fundsp"]
# Synth instruments built from fundsp graphs.
fundsp = ["dep:fundsp"]
# SoundFont (.sf2) instruments.
rustysynth = ["dep:rustysynth"]
# Loading samples from mp3, wav, ogg/vorbis and flac files.
symphonia = ["dep:symphonia"]
# Live output to the default audio device.
cpal = ["dep:cpal"]

[dependencies]
motiongfx_authoring = { workspace = true }
rtrb = { workspace = true }
fundsp = { workspace = true, optional = true }
rustysynth = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }

[dev-dependencies]
motiongfx = { workspace = true, default-features = true }

[lints]
workspace = true
